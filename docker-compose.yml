services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solanco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-solanco}
    ports:
      - "5432:5432"
    volumes:
      - solanco_pg:/var/lib/postgresql/data

volumes:
  solanco_pg:
